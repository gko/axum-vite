name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cargo test
        run: cargo test

      - name: Run ignored/integration tests (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        run: cargo test -- --ignored
