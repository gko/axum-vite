[package]
name = "axum-vite"
version = "0.1.0"
edition = "2024"
description = "Seamless Axum and Vite integration: proxies to Vite in development and embeds the frontend directly into the Rust binary for production."
repository = "https://github.com/gko/axum-vite"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["axum", "vite", "embedded", "spa", "hmr"]
categories = [
    "web-programming",
    "web-programming::http-server",
    "development-tools"
]
exclude = [
    "examples/basic-spa/*"
    "examples/template-askama/*"
]

[workspace]
members = [
    "examples/basic-spa", "examples/template-askama",
]

[dependencies]
axum = { version = "0.8.9" }
reqwest = { version = "0.12" }
mime_guess = "2.0.5"
include_dir = "0.7.4"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
